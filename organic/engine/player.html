<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#000;}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F4C3CF;}
  #stage *{box-sizing:border-box;}
  .cap{position:absolute;left:0;top:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:66px;line-height:1.05;color:#151012;background:#fff;padding:18px 30px 22px;white-space:nowrap;letter-spacing:-.5px;}
</style>
<script src="lib.js"></script>
</head><body>
<div id="stage"><div id="scene"></div><div id="caps"></div><div id="end"></div></div>
<script>
{
const SCENES = {};
window.SCENES = SCENES;
let TL = null, built = {}, capEls = [];
const { el, C, F, pr, ease, clamp, tw } = DT;

window.setup = async function (timeline) {
  TL = timeline;
  await document.fonts.load("400 100px Gloock");
  await document.fonts.load("800 60px 'Bricolage Grotesque'");
  await document.fonts.load("700 60px Caveat");
  await document.fonts.ready;
  const sceneRoot = document.getElementById('scene');
  for (const s of TL.scenes) {
    const def = SCENES[s.id];
    if (!def) throw new Error('Szene fehlt in scene.js: ' + s.id);
    const root = el('div', { left: 0, top: 0, width: '1080px', height: '1920px', overflow: 'hidden', display: 'none', background: def.bg || C.rosa }, sceneRoot);
    if (def.paper !== false) DT.paper(root, def.bg || C.rosa);
    const upd = def.build(root, { dur: s.dur, scene: s, timeline: TL }) || (() => {});
    built[s.id] = { root, upd, s };
  }
  // Untertitel
  const caps = document.getElementById('caps');
  for (const c of TL.captions) {
    const d = el('div', {}, caps); d.className = 'cap'; d.textContent = c.text; d.style.display = 'none';
    capEls.push({ d, c });
  }
  // Endcard
  if (TL.endcard !== false) buildEnd(document.getElementById('end'));
  return true;
};

let endUpd = null;
function buildEnd(root) {
  const ec = TL.endcard || {};
  const box = el('div', { left: 0, top: 0, width: '1080px', height: '1920px', display: 'none', background: C.rosa }, root);
  DT.paper(box, C.rosa);
  const tape = DT.svg(DT.ART.tape(true), {}, box, '0 0 400 400', 760, 760);
  const name = el('div', { left: 0, width: '1080px', top: '1120px', textAlign: 'center', fontFamily: F.display, fontSize: '150px', color: C.schwarz, letterSpacing: '-2px' }, box, 'Diva Tape');
  const sub = el('div', { left: 0, width: '1080px', top: '1300px', textAlign: 'center', fontFamily: F.sans, fontWeight: 500, fontSize: '50px', color: C.schwarz }, box, ec.line || 'Lippenpflege für die Nacht');
  const cta = el('div', { left: '50%', top: '1420px', transform: 'translateX(-50%)', fontFamily: F.hand, fontWeight: 700, fontSize: '76px', color: C.beere }, box, ec.cta || 'Link in Bio');
  endUpd = (t) => {
    box.style.display = t >= 0 ? 'block' : 'none';
    if (t < 0) return;
    DT.place(tape, 540, 760, tw(t, 0, .7, .6, 1, ease.outBack), tw(t, 0, .9, -14, -6), clamp(t / .25));
    name.style.opacity = pr(t, .25, .7); name.style.transform = `translateY(${tw(t, .25, .8, 40, 0)}px)`;
    sub.style.opacity = pr(t, .5, .9);
    cta.style.opacity = pr(t, .8, 1.2); cta.style.transform = `translateX(-50%) rotate(${tw(t, .8, 1.3, -8, -3, ease.outBack)}deg)`;
  };
}

window.frame = function (t) {
  for (const id in built) {
    const b = built[id], s = b.s;
    const on = t >= s.start && t < s.start + s.dur;
    b.root.style.display = on ? 'block' : 'none';
    if (on) { const lt = t - s.start; b.upd(lt, clamp(lt / s.dur)); }
  }
  for (const { d, c } of capEls) {
    const on = t >= c.start && t < c.end && !TL.noCaptions;
    d.style.display = on ? 'block' : 'none';
    if (on) {
      const k = pr(t, c.start, c.start + .18, ease.outBack);
      const w = d.offsetWidth;
      const y = (c.y ?? TL.capY ?? 1400);
      d.style.transform = `translate(${540 - w / 2}px, ${y}px) rotate(${c.rot}deg) scale(${.85 + .15 * k})`;
      d.style.opacity = clamp((t - c.start) / .08);
    }
  }
  if (endUpd) endUpd(t - TL.endStart);
};
}
</script>
<script src="SCENE_JS"></script>
</body></html>
